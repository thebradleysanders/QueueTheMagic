name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release with the changelog section for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Pull the "## [x.y.z]" section for this version out of CHANGELOG.md
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on=1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md

          if [ -s notes.md ]; then
            printf '\n' >> notes.md
            echo "Docker image: \`docker pull ${{ secrets.DOCKERHUB_USERNAME }}/queue-the-magic:${TAG}\`" >> notes.md
            NOTES_ARGS=(--notes-file notes.md)
          else
            echo "No CHANGELOG.md section for $VERSION, using generated notes"
            NOTES_ARGS=(--generate-notes)
          fi

          # GitHub's API occasionally answers 5xx; retry, and if a failed attempt actually created
          # the release, update it instead of failing.
          for attempt in 1 2 3 4; do
            if gh release view "$TAG" > /dev/null 2>&1; then
              # exists (a failed attempt created it, or a re-run): refresh the notes when we have them
              if [ -s notes.md ]; then
                gh release edit "$TAG" --title "$TAG" --notes-file notes.md && exit 0
              else
                exit 0
              fi
            else
              gh release create "$TAG" --title "$TAG" "${NOTES_ARGS[@]}" --verify-tag && exit 0
            fi
            echo "Attempt $attempt failed, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "Could not publish the GitHub release after several attempts"
          exit 1

  docker:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/queue-the-magic:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/queue-the-magic:latest
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
